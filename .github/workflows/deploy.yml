name: Dark Login CI CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Get source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Check JavaScript syntax
      - name: Validate Application
        run: |
          node --check server.js
          node --check public/script.js

      # Step 5: Connect to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 6: Deploy to Elastic Beanstalk
      - name: Deploy to AWS Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          application-name: ${{ vars.EB_APPLICATION_NAME }}
          environment-name: ${{ vars.EB_ENVIRONMENT_NAME }}
